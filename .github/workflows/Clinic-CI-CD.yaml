name: Clinic Project CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ClinicProjectApi/ClinicProjectApi.csproj

    - name: Build project
      run: dotnet build ClinicProjectApi/ClinicProjectApi.csproj --configuration Release --no-restore

    # Swap this run command with your actual test project when ready
    - name: Run Tests
      run: |
        echo "Placeholder: Running tests..."
        # dotnet test ClinicProjectTest/ClinicProjectTest.csproj --no-build --configuration Release

    - name: Publish API
      run: dotnet publish ClinicProjectApi/ClinicProjectApi.csproj --configuration Release -o ./publish --no-build

    - name: Verify publish output
      run: ls -la ./publish

    # Essential for CD: Saves the output so a deployment job can use it
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: clinic-api-publish
        path: ./publish